<!doctype html><html lang="en"><head><title>Attendance · Attendee</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Manrope,system-ui,sans-serif;background:#F3F6F8;color:#12263A}
:focus-visible{outline:3px solid #0E7C86;outline-offset:2px}
.st-Present{background:#DDF3E4;color:#14532D}.st-Late{background:#FFF0CC;color:#7A4B00}
.st-Absent{background:#FDE0DC;color:#8A1C12}.st-OnLeave{background:#DCE8FB;color:#173B7A}
.st-Notmarked,.st-Notmarkedyet{background:#E6EBEF;color:#44566A}</style></head>
<body>
<header class="flex items-center justify-between px-5 py-4 max-w-6xl mx-auto">
  <span class="font-extrabold text-xl">Attendee <span class="font-medium text-slate-600">for HR</span></span>
  <nav class="flex items-center gap-4 text-sm font-bold">
    <a href="/hr/analytics" class="underline">Analytics</a>
    <a href="/api/hr/export.csv" class="underline">Download attendance (CSV)</a>
    <button id="out" class="underline">Sign out</button>
  </nav>
</header>
<main class="max-w-6xl mx-auto px-5 pb-12">
  <section id="totals" class="grid grid-cols-2 sm:grid-cols-5 gap-3" aria-label="Totals for the selected day"></section>

  <section class="mt-6 bg-white rounded-2xl p-4 shadow-sm">
    <div class="grid gap-3 sm:grid-cols-5">
      <label class="text-sm font-bold sm:col-span-2">Search name or username
        <input id="q" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 font-normal" placeholder="e.g. Priya or emp012"></label>
      <label class="text-sm font-bold">Department
        <select id="dept" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 font-normal"><option value="">All</option></select></label>
      <label class="text-sm font-bold">Status
        <select id="fstatus" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 font-normal">
          <option value="">All</option><option>Not marked</option><option>Present</option><option>Late</option><option>Absent</option><option>On Leave</option></select></label>
      <label class="text-sm font-bold">Date
        <input id="date" type="date" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 font-normal"></label>
    </div>
  </section>

  <div class="mt-4 bg-white rounded-2xl shadow-sm overflow-x-auto">
    <table class="w-full text-left text-sm">
      <thead class="bg-slate-50 text-slate-600"><tr>
        <th class="p-3">Employee</th><th class="p-3">Department</th><th class="p-3">Location</th>
        <th class="p-3">Status</th><th class="p-3">In</th><th class="p-3">Out</th><th class="p-3">Late by</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="hidden p-6 text-slate-600">No employees match these filters. Clear the search or choose All.</p>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const cls = s => 'st-' + s.replace(/\s/g,'');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t12 = hm => { if (!hm) return '–'; const [h, m] = hm.split(':').map(Number); return ((h % 12) || 12) + ':' + String(m).padStart(2, '0') + ' ' + (h < 12 ? 'AM' : 'PM'); };
const dur = m => { const h = Math.floor(m / 60), mm = m % 60; return (h ? h + ' h ' : '') + mm + ' min'; };
const api = async url => { const r = await fetch(url); if (r.status===401||r.status===403) location.href='/'; return r.json(); };

$('date').value = new Date().toLocaleDateString('en-CA');

async function loadSummary(){
  const s = await api('/api/hr/summary?date=' + $('date').value);
  const items = [['Present',s.Present],['Late',s.Late],['Absent',s.Absent],['On Leave',s['On Leave']],['Not marked',s['Not marked']]];
  $('totals').innerHTML = items.map(([k,v]) =>
    '<div class="rounded-xl p-4 '+cls(k)+'"><div class="text-3xl font-extrabold">'+v+'</div><div class="text-sm font-bold">'+k+'</div></div>').join('');
}
async function loadRows(){
  const p = new URLSearchParams({q:$('q').value, department:$('dept').value, status:$('fstatus').value, date:$('date').value});
  const emps = (await api('/api/hr/employees?' + p)).employees;
  $('empty').classList.toggle('hidden', emps.length > 0);
  $('rows').innerHTML = emps.map(e => '<tr class="border-t">'
    + '<td class="p-3"><div class="font-bold">'+esc(e.name)+'</div><div class="text-slate-500">'+esc(e.username)+' · '+esc(e.job_title)+'</div></td>'
    + '<td class="p-3">'+esc(e.department)+'</td><td class="p-3">'+esc(e.location)+'</td>'
    + '<td class="p-3"><span class="rounded-full px-3 py-1 font-bold '+cls(e.status)+'">'+esc(e.status)+'</span></td>'
    + '<td class="p-3">'+t12(e.check_in)+'</td><td class="p-3">'+t12(e.check_out)+'</td>'
    + '<td class="p-3 font-bold '+(e.late_minutes ? 'text-amber-800' : 'text-slate-400')+'">'+(e.late_minutes ? dur(e.late_minutes) : '–')+'</td></tr>').join('');
}

let t; $('q').oninput = () => { clearTimeout(t); t = setTimeout(loadRows, 250); };
['dept','fstatus'].forEach(id => $(id).onchange = loadRows);
$('date').onchange = () => { loadRows(); loadSummary(); };
$('out').onclick = async () => { await fetch('/api/logout',{method:'POST'}); location.href='/'; };

api('/api/hr/departments').then(d => d.forEach(x => $('dept').insertAdjacentHTML('beforeend','<option>'+esc(x)+'</option>')));
loadRows(); loadSummary();
</script></body></html>
